<!DOCTYPE html>
<html lang="fr" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <title>Header fragment</title>
</head>
<body>
<header class="navbar navbar-inverse navbar-fixed-top" th:fragment="header">
    <div class="container">
        <div class="navbar-header">
            <a class="navbar-brand" href="#" th:href="@{/}">Réservations</a>
        </div>

        <div class="navbar-collapse collapse">
            <ul class="nav navbar-nav">
                <li th:classappend="${module == 'home' ? 'active' : ''}">
                    <a href="#" th:href="@{/}">Home</a>
                </li>
                <li sec:authorize="hasRole('ADMIN')" th:classappend="${module == 'artists' ? 'active' : ''}">
                    <a href="#" th:href="@{/artists}">Artists</a>
                </li>
                <li th:classappend="${module == 'artists' ? 'active' : ''}">
                    <a href="#" th:href="@{/types}">Types</a>
                </li>

<!--                <li sec:authorize="hasRole('ADMIN')">-->
<!--                    <a th:href="@{/backoffice}">Back-Office</a>-->
            </ul>
        </div>
    </div>

</body>
</html>
