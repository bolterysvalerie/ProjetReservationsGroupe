<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout" xmlns:sec="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layouts/main}">
<head>
    <title>Liste des localités</title>
</head>
<body>
<div class="container">
    <div layout:fragment="content" sec:authorize="hasRole('ADMIN')">
        <h1 th:text="${title}">Liste des localités</h1>

        <ul th:unless="${#lists.isEmpty(localities)}">
            <li th:each="locality : ${localities}">
                <span th:text="|${locality.postalCode} ${locality.locality}|">1000 Bruxelles</span>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/localities/{id}(id=${locality.id})}">Voir</a>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/localities/{id}/edit(id=${locality.id})}">Modifier</a>
                <form th:action="@{/localities/{id}(id=${locality.id})}" method="post" style="display:inline;">
                    <input type="hidden" name="_method" value="delete"/>
                    <button type="submit">Supprimer</button>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                </form>
            </li>
        </ul>

        <a sec:authorize="hasRole('ADMIN')" th:href="@{/localities/create}">Créer une localité</a>
    </div>
</div>
</body>
</html>
