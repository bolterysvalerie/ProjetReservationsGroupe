<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Liste des lieux</title>
</head>
<body>
<h1>Liste des lieux</h1>

<a th:href="@{/locations/create}">Ajouter un lieu</a>

<table>
    <thead>
    <tr>
        <th>Désignation</th>
        <th>Slug</th>
        <th>Adresse</th>
        <th>Localité</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="location : ${locations}">
        <td th:text="${location.designation}">Désignation</td>
        <td th:text="${location.slug}">slug</td>
        <td th:text="${location.address}">Adresse</td>
        <td th:text="${location.locality.postalCode + ' ' + location.locality.locality}">Localité</td>
        <td>
            <a th:href="@{/locations/{id}(id=${location.id})}">Voir</a> |
            <a th:href="@{/locations/{id}/edit(id=${location.id})}">Modifier</a> |
            <form th:action="@{/locations/{id}(id=${location.id})}" method="post" style="display:inline">
                <input type="hidden" name="_method" value="delete"/>
                <button type="submit" onclick="return confirm('Supprimer ce lieu ?')">Supprimer</button>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
