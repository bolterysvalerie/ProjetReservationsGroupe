<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Nouveau price</title>
</head>
<body>
<h1>Créer un nouveau price</h1>

<form th:action="@{/prices/create}" th:object="${price}" method="post">
    <p>
        <label>Type :</label>
        <input type="text" th:field="*{type}" />
    </p>
    <p>
        <label>Prix :</label>
        <input type="number" step="0.01" th:field="*{amount}" />
    </p>
    <p>
        <label>Début :</label>
        <input type="date" th:field="*{start_date}" />
    </p>
    <p>
        <label>Fin :</label>
        <input type="date" th:field="*{end_date}" />
    </p>
    <!-- Liste des shows en checkbox -->
    <h3>Shows associés :</h3>
    <div th:each="s : ${shows}">
        <label>
            <input type="checkbox"
                   name="showIds"
                   th:value="${s.id}" />
            <span th:text="${s.title}">Titre du show</span>
        </label><br/>
    </div>

    <button type="submit">Enregistrer</button>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
</form>

<a th:href="@{/prices}">Retour liste</a>
</body>
</html>
