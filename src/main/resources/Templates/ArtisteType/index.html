
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Liste des Liens Artiste-Type</title>
    <link rel="stylesheet" href="/css/formulaire/formulaire.css">
</head>
<body>
<h1>Liste des Liens Artiste-Type</h1>

<div th:if="${successMessage}">
    <p th:text="${successMessage}" style="color:green;"></p>
</div>
<div th:if="${errorMessage}">
    <p th:text="${errorMessage}" style="color:red;"></p>
</div>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Artiste</th>
        <th>Type</th>
        <!-- Nouvelle colonne -->
        <th>Shows</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="link : ${artisteTypes}">
        <td th:text="${link.id}"></td>
        <td th:text="${link.artist.firstname + ' ' + link.artist.lastname}"></td>
        <td th:text="${link.type.type}"></td>
        <!-- Affichage des shows liés -->
        <td>
            <ul>
                <li th:each="s : ${link.shows}" th:text="${s.title}"></li>
            </ul>
        </td>
        <td>
            <a th:href="@{'/artiste-types/' + ${link.id} + '/edit'}">Modifier</a>
            <form th:action="@{'/artiste-types/' + ${link.id} + '/delete'}" method="post" style="display:inline;">
                <button type="submit">Supprimer</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<a th:href="@{/artiste-types/create}">Créer un nouveau lien</a>

</body>
</html>
