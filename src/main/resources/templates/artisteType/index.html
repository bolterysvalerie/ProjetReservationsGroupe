<html lang="fr" xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout"
      layout:decorate="~{layouts/main}" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <title>Liste des Liens Artiste-Type</title>
    <meta charset="UTF-8">
    <style>
        .containerDivImportant {
            width: 90%;
            max-width: 600px;
            padding: 20px;
            margin: auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        p {
            font-size: 1rem;
            color: #555;
        }

        .success-message {
            color: green;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .error-message {
            color: red;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border: 1px solid #ddd;
        }

        th {
            background-color: #f2f2f2;
            color: #333;
            font-weight: bold;
        }

        td {
            background-color: #fff;
        }

        td ul {
            list-style-type: none;
            padding-left: 0;
            margin: 0;
        }

        td ul li {
            padding: 3px 0;
            font-size: 0.9rem;
            color: #555;
        }

        a {
            color: #007bff;
            text-decoration: none;
            font-size: 1rem;
            transition: color 0.3s;
        }

        a:hover {
            color: #0056b3;
        }

        button {
            background-color: #ff4d4d;
            color: white;
            padding: 8px 12px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #e60000;
        }

        .actions {
            text-align: center;
            margin-top: 20px;
        }

        .create-link {
            text-align: center;
            margin-top: 20px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
<div class="containerDivImportant" layout:fragment="content" sec:authorize="hasRole('ADMIN')">

    <h1>Liste des Liens Artiste-Type</h1>
    <div th:if="${successMessage}">
        <p th:text="${successMessage}" style="color:green;"></p>
    </div>
    <div th:if="${errorMessage}">
        <p th:text="${errorMessage}" style="color:red;"></p>
    </div>

    <table border="1">
        <thead>
        <tr>
            <th>ID</th>
            <th>Artiste</th>
            <th>Type</th>
            <!-- Nouvelle colonne -->
            <th>Shows</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="link : ${artisteTypes}">
            <td th:text="${link.id}"></td>
            <td th:text="${link.artist.firstname + ' ' + link.artist.lastname}"></td>
            <td th:text="${link.type.type}"></td>
            <!-- Affichage des shows liés -->
            <td>
                <ul>
                    <li th:each="s : ${link.shows}" th:text="${s.title}"></li>
                </ul>
            </td>
            <td>
                <a th:href="@{'/artiste-types/' + ${link.id} + '/edit'}">Modifier</a>
                <form th:action="@{'/artiste-types/' + ${link.id} + '/delete'}" method="post" style="display:inline;">
                    <button type="submit">Supprimer</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/artiste-types/create}">Créer un nouveau lien</a>
</div>
</body>
</html>
