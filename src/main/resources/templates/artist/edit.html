<!DOCTYPE html>
<html lang="fr" xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout" layout:decorate="~{layouts/main}"
      xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Update an artist</title>

    <style>
        .fieldError {
            color: red;
        }

        .containerDivImportant {
            width: 90%;
            max-width: 600px;
            padding: 20px;
            margin: auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            text-align: center;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 1rem;
            margin-bottom: 5px;
            color: #555;
        }

        input[type="text"] {
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 15px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #007bff;
        }

        .fieldError {
            color: red;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        button {
            background-color: #007bff;
            color: white;
            padding: 10px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-right: 10px;
            margin-top: 15px;
        }

        button[type="reset"] {
            background-color: #ccc;
        }

        button:hover {
            background-color: #0056b3;
        }

        a {
            text-decoration: none;
            color: #007bff;
            font-size: 1rem;
            text-align: center;
            margin-top: 15px;
        }

        a:hover {
            text-decoration: underline;
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
        }

        nav {
            text-align: center;
            margin-top: 30px;
        }
    </style>
</head>
<body>

<div id="notification" th:replace="~{main :: notification}"></div>
<div class="containerDivImportant" layout:fragment="content">
    <h1 th:text="|${artist.firstname} ${artist.lastname}|">Bob Sull</h1>

    <form th:action="@{/artist/{id}/edit(id=${artist.id})}" th:object="${artist}" th:method="put">
        <div>
            <label>Id:</label>
            <span th:text="${artist.id}">1</span>
        </div>
        <div>
            <label>Firstname:</label>
            <input type="text" th:field="*{firstname}">
            <p th:if="${#fields.hasErrors('firstname')}" th:errors="*{firstname}" th:errorclass="fieldError"></p>
        </div>
        <div>
            <label>Lastname:</label>
            <input type="text" th:field="*{lastname}">
            <p th:if="${#fields.hasErrors('lastname')}" th:errors="*{lastname}" th:errorclass="fieldError"></p>
        </div>

        <!-- AddTroupe visible uniquement pour ADMIN -->
        <td sec:authorize="hasRole('ADMIN')"><a th:href="@{/troupes}"
                                                sec:authorize="hasRole('ADMIN')">Add troupe</a></td>


        <div>
            <button type="submit" th:text="Update">Update</button>
            <button type="reset" th:text="Reset">Reset</button>
            <a th:href="${back}">Back</a>
        </div>
    </form>

    <nav><a th:href="@{/artists}"> Back to the index</a></nav>
</div>

</body>
</html>
