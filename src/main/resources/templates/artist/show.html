<!DOCTYPE html>
<html lang="fr"
      xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org"
      layout:decorate="~{layouts/main}">
<head>
    <meta charset="UTF-8">
    <title>Profile of an artist</title>
    <link rel="stylesheet" href="/css/formulaire/formulaire.css">
</head>
<body>
<div class="container">
    <div id="notification" th:replace="~{main :: notification}"></div>

    <div layout:fragment="content">

        <h1 th:text="|${artist.firstname} ${artist.lastname}|">Bob Sull</h1>

        <!-- AJOUT : affichage de la troupe -->
        <p>
            <strong>Troupe :</strong>
            <span th:if="${artist.troupe != null}">
                <span th:text="${artist.troupe.name}">Nom de la troupe</span>
                <img th:if="${artist.troupe.logoUrl != null}"
                     th:src="${artist.troupe.logoUrl}"
                     width="50"
                     alt="Logo de la troupe"/>
            </span>
            <span th:unless="${artist.troupe != null}">Non affilié</span>
        </p>

        <!-- Formulaire d’affiliation (ADMIN uniquement) -->
        <form th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
              th:action="@{/artist/{id}/edit(id=${artist.id})}"
              method="post">
            <input type="hidden" name="_method" value="put"/>
            <label for="troupeSelect">Changer de troupe :</label>
            <select id="troupeSelect" name="troupeId">
                <option th:value="" th:selected="${artist.troupe == null}">
                    Non affilié
                </option>
                <option th:each="t : ${troupes}"
                        th:value="${t.id}"
                        th:text="${t.name}"
                        th:selected="${artist.troupe != null} ? ${t.id} == ${artist.troupe.id} : false">
                </option>
            </select>
            <button type="submit">Enregistrer</button>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        </form>

        <h2>Liste des types</h2>
        <ul th:unless="${#lists.isEmpty(artist.types)}">
            <li th:each="type : ${artist.types}"
                th:text="${type.type}">Type</li>
        </ul>

        <div class="actions">
            <a th:href="@{/artist/{id}/edit(id=${artist.id})}">Edit</a>
        </div>
        <div class="action">
            <form th:id="|deleteForm-${artist.id}|"
                  th:action="@{/artist/{id}(id=${artist.id})}"
                  th:method="delete">
                <a href="#"
                   th:onclick="|if(confirm('Confirm delete artist #${artist.id}')) document.getElementById('deleteForm-${artist.id}').submit(); return false;|">
                    Delete
                </a>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            </form>
        </div>

        <nav><a th:href="@{/artists}">Retour à l'index</a></nav>
        <nav><a th:href="@{/backoffice}">Retour au Backoffice</a></nav>

    </div>
</div>
</body>
</html>
