<!DOCTYPE html>
<html lang="fr" xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout" layout:decorate="~{layouts/main}"
      xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <title>Type</title>
</head>
<body>
<div class="container">
  <div layout:fragment="content">
    <h1 th:text="${type.type}">Compositeur</h1>

    <div class="action">
      <td><a th:href="@{/type/{id}/edit(id=${type.id})}">Edit</a></td>
    </div>
    <div class="action">
      <form th:id="|deleteForm-${type.id}|" th:action="@{/type/{id}(id=${type.id})}" th:method="delete">
        <a href="#" th:onclick="|if(confirm('Confirm delete type #${type.id}')) document.getElementById('deleteForm-${type.id}').submit(); return false;|">
          Delete
        </a>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      </form>
    </div>

    <nav><a th:href="@{/types}">Back</a></nav>
    <div sec:authorize="hasRole('ADMIN')">
      <a th:href="@{/backoffice}">Retour au Backoffice</a>
    </div>
  </div>
</div>
</body>
</html>
