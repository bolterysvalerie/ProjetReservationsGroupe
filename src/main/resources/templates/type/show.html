<!DOCTYPE html>
<html lang="fr" xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout" layout:decorate="~{layouts/main}">
<head>
    <meta charset="UTF-8">
    <title>Type</title>
    <style>
        .containerDivImportant {
            width: 90%;
            max-width: 600px;
            padding: 20px;
            margin: auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }


        /* Style du titre */
        h1 {
            font-size: 2em;
            color: #333;
            margin-bottom: 20px;
        }

        /* Style des actions (Edit, Delete) */
        .action {
            margin-bottom: 15px;
        }

        .action a {
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 5px;
            color: white;
            background-color: #5bc0de;
            transition: background-color 0.3s ease;
            margin-right: 10px;
        }

        .action a:hover {
            background-color: #31b0d5;
        }

        .action form a {
            background-color: #d9534f;
            color: white;
        }

        .action form a:hover {
            background-color: #c9302c;
        }

        /* Style pour le lien de retour */
        nav a {
            text-decoration: none;
            padding: 10px 15px;
            background-color: #337ab7;
            color: white;
            border-radius: 5px;
            display: inline-block;
            margin-top: 20px;
            transition: background-color 0.3s ease;
        }

        nav a:hover {
            background-color: #286090;
        }
    </style>
</head>
<body>

<div class="containerDivImportant" layout:fragment="content">
    <h1 th:text="${type.type}">Compositeur</h1>

    <div class="action">
        <td><a th:href="@{/type/{id}/edit(id=${type.id})}">Edit</a></td>
    </div>
    <div class="action">
        <form th:id="|deleteForm-${type.id}|" th:action="@{/type/{id}(id=${type.id})}" th:method="delete">
            <a href="#"
               th:onclick="|if(confirm('Confirm delete type #${type.id}')) document.getElementById('deleteForm-${type.id}').submit(); return false;|">
                Delete
            </a>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        </form>
    </div>

    <nav><a th:href="@{/types}">Back</a></nav>
</div>

</body>
</html>
