<!DOCTYPE html>
<html lang="fr" xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout" layout:decorate="~{layouts/main}">
<head>
    <meta charset="UTF-8">
    <title>Update a Type</title>
    <style>
        .fieldError {
            color: red;
        }

        .containerDivImportant {
            width: 90%;
            max-width: 800px;
            padding: 20px;
            margin: auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }


        /* Style du titre */
        h1 {
            font-size: 1.8em;
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Style pour les éléments du formulaire */
        form div {
            margin-bottom: 15px;
        }

        form label {
            display: block;
            font-size: 1em;
            color: #555;
            margin-bottom: 5px;
        }

        form input[type="text"] {
            width: 100%;
            padding: 8px;
            font-size: 1em;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        form input[type="text"]:focus {
            border-color: #5cb85c;
            outline: none;
        }

        form p {
            color: #d9534f;
            font-size: 0.9em;
            margin-top: 5px;
        }

        /* Style pour les boutons */
        button {
            padding: 10px 20px;
            font-size: 1em;
            border: none;
            background-color: #5bc0de;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-right: 10px;
        }

        button:hover {
            background-color: #31b0d5;
        }

        button[type="reset"] {
            background-color: #f0ad4e;
        }

        button[type="reset"]:hover {
            background-color: #ec971f;
        }

        /* Style du lien "Back" */
        a {
            text-decoration: none;
            color: #337ab7;
            font-size: 1em;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Style pour le lien de retour à l'index */
        nav a {
            display: inline-block;
            padding: 10px 20px;
            background-color: #337ab7;
            color: white;
            border-radius: 5px;
            margin-top: 20px;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }

        nav a:hover {
            background-color: #286090;
        }
    </style>
</head>
<body>

<div class="containerDivImportant" layout:fragment="content">
    <h1 th:text="${onetype.type}">Un type</h1>

    <form th:action="@{/type/{id}/edit(id=${onetype.id})}" th:object="${onetype}" th:method="put">
        <div>
            <label>Id:</label>
            <span th:text="${onetype.id}">1</span>
        </div>
        <div>
            <label>Type:</label>
            <input type="text" th:field="*{type}"/>
            <p th:if="${#fields.hasErrors('type')}" th:errors="*{type}" th:errorclass="fieldError"></p>
        </div>
        <div>
            <button type="submit" th:text="Update">Update</button>
            <button type="reset" th:text="Reset">Reset</button>
            <a th:href="${back}">Back</a>
        </div>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    </form>

    <nav><a th:href="@{/types}">Back to the index</a></nav>
</div>

</body>
</html>
