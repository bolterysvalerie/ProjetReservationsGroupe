<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout"
      layout:decorate="~{layouts/main}" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <title>Créer une Représentation</title>
    <meta charset="UTF-8">
    <style>
        .containerDivImportant {
            width: 90%;
            max-width: 800px;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            margin: auto auto 25px;
        }

        /* Style du titre */
        h1 {
            font-size: 2em;
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Style des étiquettes */
        label {
            display: block;
            font-size: 1em;
            color: #555;
            margin-bottom: 5px;
        }

        /* Style des champs de saisie */
        input[type="datetime-local"],
        select {
            width: 100%;
            padding: 10px;
            font-size: 1em;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        /* Bouton de soumission */
        button[type="submit"] {
            background-color: #5bc0de;
            color: white;
            padding: 10px 20px;
            font-size: 1em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
            margin-top: 15px;
        }

        button[type="submit"]:hover {
            background-color: #31b0d5;
        }

        /* Style pour le lien d'annulation */
        #aCancel {
            display: inline-block;
            padding: 10px 20px;
            background-color: #6c757d; /* Couleur de fond neutre */
            color: white; /* Texte en blanc */
            border-radius: 5px; /* Bords arrondis */
            text-decoration: none; /* Retirer la décoration par défaut */
            text-align: center; /* Centrer le texte dans le lien */
            width: 95%; /* S'adapte à la largeur du conteneur */
            margin-top: 15px; /* Marge supérieure pour espacer du bouton principal */
            transition: background-color 0.3s ease, transform 0.2s ease; /* Effet au survol */
        }

        /* Effet au survol */
        #aCancel:hover {
            background-color: #5a6268; /* Change la couleur de fond au survol */
            transform: scale(1.05); /* Légère animation pour "agrandir" au survol */
        }

        /* Si tu veux personnaliser encore plus, tu peux ajouter un effet au focus */
        #aCancel:focus {
            outline: none; /* Retirer la bordure de focus par défaut */
            background-color: #4e555b; /* Une couleur un peu plus sombre au focus */
        }

        /* Appliquer une bordure plus marquée quand un champ a le focus */
        input:focus, select:focus {
            border-color: #5cb85c;
            outline: none;
        }

        /* Gestion du formulaire */
        form {
            margin-top: 20px;
        }

        /* Ajouter des espaces pour les éléments de formulaire */
        form > label {
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div id="notification" th:replace="~{main :: notification}"></div>
<div class="containerDivImportant" layout:fragment="content" sec:authorize="hasRole('ADMIN')">
    <h1>Créer une nouvelle Représentation</h1>

    <!-- Formulaire relié à representationForm -->
    <form th:action="@{/representations/create}"
          th:object="${representationForm}"
          method="post">

        <!-- Champ date/heure -->
        <label for="schedule">Date / Heure :</label>
        <input type="datetime-local" id="schedule" th:field="*{schedule}"/>
        <br/>

        <!-- Sélection du Show -->
        <label for="showSelect">Show :</label>
        <select id="showSelect" th:name="showId">
            <option th:each="s : ${shows}"
                    th:value="${s.id}"
                    th:text="${s.title}">
            </option>
        </select>
        <br/>

        <!-- Sélection du Location -->
        <label for="locationSelect">Lieu :</label>
        <select id="locationSelect" th:name="locationId">
            <option th:each="l : ${locations}"
                    th:value="${l.id}"
                    th:text="${l.designation}">
            </option>
        </select>
        <br/>

        <!-- Bouton d'envoi -->
        <button type="submit">Enregistrer</button>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    </form>

    <!-- Lien pour annuler et revenir à la liste -->
    <a id="aCancel" th:href="@{/representations}">Annuler</a>
</div>
</body>
</html>
