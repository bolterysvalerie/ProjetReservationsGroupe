<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Fiche d'une représentation</title>
    <style>
        .containerDivImportant {
            width: 90%;
            max-width: 800px;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            margin: auto auto 25px;
        }


        /* Style de l'article */
        article {
            margin-bottom: 20px;
        }

        /* Style du titre */
        h1 {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 15px;
            font-weight: normal;
        }

        /* Style des paragraphes */
        p {
            font-size: 1.1em;
            color: #555;
            margin-bottom: 15px;
        }

        /* Style des informations mises en évidence */
        strong {
            font-weight: bold;
            color: #333;
        }

        /* Style du lien de retour */
        nav a {
            display: inline-block;
            padding: 10px 20px;
            background-color: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            text-align: center;
            margin-top: 20px;
            transition: background-color 0.3s ease;
        }

        nav a:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

<div class="containerDivImportant" layout:fragment="content">
    <article>
        <h1 th:text="'Représentation du ' + ${#temporals.format(representation.schedule, 'dd-MM-yyyy')}
                          + ' à ' + ${#temporals.format(representation.schedule, 'HH:mm')}">
            Représentation du 15-01-2020 à 13:30
        </h1>
        <p><strong>Spectacle:</strong>
            <span th:text="${representation.show.title}">Ayiti</span>
        </p>

        <p><strong>Lieu:</strong>
            <span th:if="${representation.location}"
                  th:text="${representation.location.designation}">
			        	Art Center
			 </span>
            <span th:unless="${representation.location}"
                  th:if="${representation.show.location}"
                  th:text="${representation.show.location.designation}">
			        Art Center
			 </span>
            <em th:if="${representation.location}==null and
					${representation.show.location}==null">
                à déterminer
            </em>
        </p>
    </article>

    <nav><a th:href="@{/representations}">Retour à l'index</a></nav>
</div>

</body>
</html>
