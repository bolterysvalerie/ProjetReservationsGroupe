<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>SingIn</title>
</head>
<body>
<h1>Inscription</h1>
<form action="/signin" method="post" th:object="${user}">


    <label for="login">Nom d'utilisateur :</label>
    <input type="text" id="login" name="login" th:field="*{login}" required>
    <br>

    <label for="password">Mot de passe :</label>
    <input type="password" id="password" name="password" th:field="*{password}" required>
    <br>

    <label for="firstName">Prénom :</label>
    <input type="text" id="firstName" name="firstName" th:field="*{firstName}">
    <br>

    <label for="lastName">Nom :</label>
    <input type="text" id="lastName" name="lastName" th:field="*{lastName}">
    <br>

    <label for="email">Email :</label>
    <input type="email" id="email" name="email" th:field="*{email}" required>
    <br>

    <label for="language">Choix de la langue :</label>
    <select id="language" name="language" th:field="*{language}" required>
        <option value="fr" th:selected="${user.language == 'fr'}">Français</option>
        <option value="nl" th:selected="${user.language == 'nl'}">Néerlandais</option>
    </select>
    <br>


    <button type="submit">S'inscrire</button>

    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
</form>

<div th:if="${error}" style="color:red;">
    <p th:text="${error}"></p>
</div>


<div th:if="${success}" style="color:green;">
    <p th:text="${success}"></p>
</div>
</body>
</html>
