<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layouts/main}"
      xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout">
<head>
    <title>Modifier un price</title>
    <meta charset="UTF-8">
    <style>
        .containerDivImportant {
            width: 90%;
            max-width: 600px;
            padding: 20px;
            margin: auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        /* Titre principal */
        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Style pour le formulaire */
        form {
            display: flex;
            flex-direction: column;
        }

        /* Style des champs de formulaire */
        p {
            font-size: 16px;
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        input[type="text"], input[type="number"], input[type="date"], select {
            padding: 8px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-top: 5px;
            width: 100%;
            box-sizing: border-box;
        }

        /* Liste des shows en checkbox */
        h3 {
            font-size: 18px;
            margin-top: 20px;
            margin-bottom: 10px;
            color: #333;
        }

        input[type="checkbox"] {
            margin-right: 10px;
        }

        /* Boutons */
        button[type="submit"] {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 20px;
            width: 200px;
            align-self: center;
        }

        button[type="submit"]:hover {
            background-color: #0056b3;
        }

        /* Lien "Annuler" */
        a {
            text-align: center;
            margin-top: 20px;
            font-size: 16px;
            color: #007bff;
            text-decoration: none;
        }

        a:hover {
            color: #0056b3;
        }

        /* Espacement et alignement */
        nav {
            text-align: center;
            margin-top: 30px;
        }
    </style>
</head>
<body>
<div id="notification" th:replace="~{main :: notification}"></div>
<div class="containerDivImportant" layout:fragment="content">
    <h1>Modifier un price</h1>

    <form th:action="@{/prices/{id}/edit(id=${price.id})}" th:object="${price}" method="post">
        <input type="hidden" name="_method" value="put"/>

        <p>
            <label>Type :</label>
            <input type="text" th:field="*{type}"/>
        </p>
        <p>
            <label>Prix :</label>
            <input type="number" step="0.01" th:field="*{amount}"/>
        </p>
        <p>
            <label>Début :</label>
            <input type="date" th:field="*{start_date}"/>
        </p>
        <p>
            <label>Fin :</label>
            <input type="date" th:field="*{end_date}"/>
        </p>

        <!-- Liste des shows en checkbox -->
        <h3>Shows associés :</h3>
        <div th:each="s : ${shows}">
            <label>
                <!-- cocher si ce Price contient déjà ce show -->
                <input type="checkbox"
                       name="showIds"
                       th:value="${s.id}"
                       th:checked="${price.shows.contains(s)}"/>
                <span th:text="${s.title}">Titre du show</span>
            </label><br/>
        </div>

        <button type="submit">Enregistrer</button>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    </form>

    <a th:href="@{/prices}">Annuler</a>
</div>
</body>
</html>
