<html lang="fr" xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout"
      layout:decorate="~{layouts/main}" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <title>Nouveau price</title>
    <meta charset="UTF-8">
    <style>
        .containerDivImportant {
            width: 90%;
            max-width: 800px;
            padding: 20px;
            margin: auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        /* Titre principal */
        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Formulaire */
        form {
            display: flex;
            flex-direction: column;
        }

        /* Champ de formulaire */
        label {
            font-size: 16px;
            margin-bottom: 8px;
        }

        input {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            width: 500px;
        }

        fieldset {
            border: none;
        }

        input[type="checkbox"] {
            margin-right: 10px;
            width: auto;
        }

        button[type="submit"] {
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            align-self: flex-start; /* Align to the left for a better form look */
        }

        button[type="submit"]:hover {
            background-color: #218838;
        }

        /* Lien pour annuler ou revenir */
        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #007bff;
            font-size: 16px;
        }

        a:hover {
            color: #0056b3;
        }

        /* Espacement des éléments */
        p {
            margin: 0 0 20px;
        }

        /* Titre des shows associés */
        h3 {
            margin-top: 20px;
            font-size: 22px;
            color: #333;
        }

        /* Style pour les listes de shows associés */
        div input[type="checkbox"] {
            margin-right: 8px;
        }

        div label {
            font-size: 16px;
            margin-bottom: 8px;
            display: inline-block;
        }

        /* Améliorations de la présentation du formulaire */
        form > p {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
<div class="containerDivImportant" layout:fragment="content" sec:authorize="hasRole('ADMIN')">
    <h1>Créer un nouveau price</h1>

    <form th:action="@{/prices/create}" th:object="${price}" method="post">
        <fieldset>
            <label>Type :</label>
            <input type="text" th:field="*{type}"/>
        </fieldset>
        <fieldset>
            <label>Prix :</label>
            <input type="number" step="0.01" th:field="*{amount}"/>
        </fieldset>
        <fieldset>
            <label>Début :</label>
            <input type="date" th:field="*{start_date}"/>
        </fieldset>
        <fieldset>
            <label>Fin :</label>
            <input type="date" th:field="*{end_date}"/>
        </fieldset>
        <!-- Liste des shows en checkbox -->
        <h3>Shows associés :</h3>
        <div th:each="s : ${shows}">
            <label>
                <input type="checkbox"
                       name="showIds"
                       th:value="${s.id}"/>
                <span th:text="${s.title}">Titre du show</span>
            </label><br/>
        </div>

        <button type="submit">Enregistrer</button>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    </form>

    <a th:href="@{/prices}">Retour liste</a>
</div>
</body>
</html>
