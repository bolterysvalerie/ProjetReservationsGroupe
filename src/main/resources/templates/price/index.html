<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layouts/main}"
      xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Liste des prix</title>
    <style>
        .containerDivImportant {
            width: 90%;
            max-width: 950px;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            margin: auto auto 25px;
        }

        /* Titre principal */
        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Bouton pour ajouter un prix */
        .actions {
            margin-bottom: 20px;
            text-align: right;
        }

        .actions a {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 16px;
        }

        .actions a:hover {
            background-color: darkblue;
            color: white;
        }

        /* Style du tableau */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            table-layout: fixed;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f8f9fa;
            font-weight: bold;
        }

        td {
            background-color: #fff;
            font-size: 16px;
        }

        /* Lien dans le tableau */
        a {
            text-decoration: none;
            color: #007bff;
        }

        a:hover {
            color: #0056b3;
        }

        /* Formulaire de suppression */
        form {
            display: inline-block;
        }

        button[type="submit"] {
            background-color: #e3342f;
            color: white;
            border: none;
            padding: 5px 10px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button[type="submit"]:hover {
            background-color: #cc1f1a;
        }

        /* Espacement général */
        table + .actions {
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div id="notification" th:replace="~{main :: notification}"></div>
<div class="containerDivImportant" layout:fragment="content" sec:authorize="hasRole('ADMIN')">

    <h1>Liste des prix</h1>

    <div class="actions">
        <a th:href="@{/prices/create}">Créer un nouveau prix</a>
    </div>

    <table border="1">
        <thead>
        <tr>
            <th>ID</th>
            <th>Type</th>
            <th>Montant</th>
            <th>Date de début</th>
            <th>Date de fin</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${prices}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.type}"></td>
            <td th:text="${p.amount}"></td>
            <td th:text="${#temporals.format(p.start_date, 'dd/MM/yyyy')}"></td>
            <td th:text="${#temporals.format(p.end_date, 'dd/MM/yyyy')}"></td>
            <td>
                <a th:href="@{/prices/{id}(id=${p.id})}">Voir</a> |
                <a th:href="@{/prices/{id}/edit(id=${p.id})}">Modifier</a> |
                <form th:action="@{/prices/{id}(id=${p.id})}" method="post" style="display:inline;">
                    <input type="hidden" name="_method" value="delete"/>
                    <button type="submit" onclick="return confirm('Confirmer la suppression ?')">Supprimer</button>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
