<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Connexion</title>
    <meta charset="UTF-8">
    <style>
        .containerDivImportant {
            width: 90%;
            max-width: 600px;
            padding: 20px;
            margin: auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        /* Titre principal */
        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
        }

        /* Style du formulaire */
        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        label {
            font-size: 14px;
            color: #555;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #007bff;
            outline: none;
        }

        /* Bouton de soumission (Se connecter) */
        button[type="submit"] {
            background-color: #007bff;
            color: white;
            font-size: 16px;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        button[type="submit"]:hover {
            background-color: #0056b3;
        }

        /* Bouton S'inscrire */
        form[action="/signin"] button {
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background-color 0.3s ease;
        }

        form[action="/signin"] button:hover {
            background-color: #218838;
        }

        /* Espacement entre les formulaires */
        form + form {
            margin-top: 15px;
        }

    </style>
</head>
<body>
<div class="containerDivImportant" layout:fragment="content">
    <h1 class="mb-4">Connexion</h1>

    <form th:action="@{/login}" method="post">
        <div>
            <label>Login:</label>
            <input type="text" name="login" maxlength="60" required>
        </div>
        <div>
            <label>Password:</label>
            <input type="password" name="password" maxlength="60" required>
        </div>
        <div>
            <button type="submit" class="btn btn-primary mt-4">Se connecter</button>
        </div>
    </form>
    <form action="/signin" method="get">
        <button type="submit">S'inscrire</button>
    </form>
</div>

</body>
</html>
