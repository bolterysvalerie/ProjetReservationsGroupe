<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <meta charset="UTF-8">
    <title>Modifier le spectacle</title>
    <style>
        .containerDivImportant {
            width: 90%;
            max-width: 800px;
            padding: 20px;
            margin: auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        /* Style du titre */
        h1 {
            font-size: 2em;
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Style du message d'erreur */
        .alert {
            padding: 15px;
            margin-bottom: 20px;
            color: #a94442;
            background-color: #f2dede;
            border: 1px solid #ebccd1;
            border-radius: 5px;
        }

        /* Style des groupes de formulaire */
        .form-group {
            margin-bottom: 20px;
        }

        /* Style des étiquettes */
        label {
            display: block;
            font-size: 1em;
            color: #555;
            margin-bottom: 5px;
        }

        /* Style des champs de saisie */
        input[type="text"],
        input[type="number"],
        input[type="datetime-local"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            font-size: 1em;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        /* Champ checkbox */
        input[type="checkbox"] {
            margin-right: 10px;
        }

        /* Style du bouton de soumission */
        button[type="submit"] {
            background-color: #5bc0de;
            color: white;
            padding: 10px 20px;
            font-size: 1em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
        }

        button[type="submit"]:hover {
            background-color: #31b0d5;
        }

        /* Style pour le bouton de retour */
        a.btn-secondary {
            display: inline-block;
            padding: 10px 20px;
            background-color: #6c757d;
            color: white;
            border-radius: 5px;
            text-decoration: none;
            text-align: center;
            margin-top: 20px;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        a.btn-secondary:hover {
            background-color: #5a6268;
        }

        /* Appliquer une bordure plus marquée quand un champ a le focus */
        input:focus, select:focus {
            border-color: #5cb85c;
            outline: none;
        }

        /* Alignement des champs de formulaire pour que les checkboxes se comportent correctement */
        .form-check-input {
            margin-top: 5px;
        }
    </style>
</head>
<body>
<div class="containerDivImportant" layout:fragment="content">
    <h1>Modifier le spectacle</h1>

    <!-- Affichage du message d'erreur, s'il y en a -->
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <form th:action="@{/show/{id}/edit(id=${show.id})}" th:object="${show}" method="post">
        <!-- Pour simuler une requête PUT -->
        <input type="hidden" name="_method" value="put"/>

        <div class="form-group">
            <label for="title">Titre :</label>
            <input type="text" id="title" th:field="*{title}" class="form-control" required/>
        </div>

        <div class="form-group">
            <label for="posterUrl">URL de l'affiche :</label>
            <input type="text" id="posterUrl" th:field="*{posterUrl}" class="form-control" required/>
        </div>

        <div class="form-group">
            <label for="duration">Durée (minutes) :</label>
            <input type="number" id="duration" th:field="*{duration}" class="form-control" min="0" required/>
        </div>

        <div class="form-group">
            <label for="created_in">Date de création :</label>
            <input type="datetime-local" id="created_in" th:field="*{created_in}" class="form-control"/>
        </div>

        <div class="form-group">
            <label for="bookable">Réservable :</label>
            <input type="checkbox" id="bookable" th:field="*{bookable}" class="form-check-input"/>
        </div>

        <div class="form-group">
            <label for="locationId">Lieu :</label>
            <select id="locationId" name="locationId" class="form-control">
                <option value="">-- Choisir un lieu --</option>
                <option th:each="loc : ${locations}"
                        th:value="${loc.id}"
                        th:text="${loc.designation}"
                        th:selected="${show.location != null} ? (${show.location.id} == ${loc.id}) : false">
                </option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary mt-3">Enregistrer les modifications</button>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    </form>

    <!-- Le lien "Annuler" utilise l'attribut 'back' qui doit être préparé dans le modèle par le contrôleur -->
    <a th:href="${back}" class="btn btn-secondary mt-3">Annuler</a>
</div>
</body>
</html>
