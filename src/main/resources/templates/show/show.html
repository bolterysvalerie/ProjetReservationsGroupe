<!DOCTYPE html>
<html layout:decorate="~{layouts/main}"
      xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title th:text="${TheTitle}">Shows</title>
    <style>
        /* Title of the show */
        #title {
            text-align: center;
            font-style: italic;
        }

        /* Picture of the show */
        img {
            width: 600px;
            height: 450px;
            display: block;
            margin: auto auto 40px;
        }

        /* Text for place created show */
        #placeCreated {
            text-align: center;
            font-style: italic;
            text-decoration: underline;
        }

        /* Table Styling */
        table {
            width: 1150px;
            border-collapse: collapse;
            margin: 20px auto;
            background-color: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f8f8f8;
            color: #333;
        }

        td {
            background-color: #fafafa;
        }

        td select {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ddd;
            font-size: 1em;
            background-color: #fff;
        }

        button {
            padding: 8px 15px;
            background-color: #28a745;
            color: white;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #218838;
        }

        /* Collaborators section */
        ul {
            list-style: none;
            padding-left: 0;
        }

        ul li {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div layout:fragment="content">
    <h1 th:text="${show.title}" id="title">List of Shows</h1>

    <div>
        <div class="show">
            <!--            <img th:src="@{${'/images/' + show.posterUrl}}" th:alt="${show.title}" id="pictureShow">-->
            <img th:src="@{${show.posterUrl}}" th:alt="${show.title}">
        </div>
        <p th:if="${show.location}" id="placeCreated"><strong>Lieu de création:</strong> <span
                th:text="${show.location.designation}"></span></p>
    </div>

    <table>
        <tr>
            <th>Date</th>
            <th>Heure</th>
            <th>Salle</th>
            <th>Addresse</th>
            <th>Prix</th>
            <th>Reserver</th>
        </tr>

        <tr th:each="representation: ${show.representations}">
            <td th:text="${#temporals.format(representation.schedule, 'dd MMMM yy')}"></td>
            <td th:text="${#temporals.format(representation.schedule, 'HH:mm')}"></td>
            <td th:text="${representation.location.designation}"></td>
            <td th:utext="${representation.location.address} + '<br/>' + ${representation.location.locality.postalCode} +' ' + ${representation.location.locality.locality} "></td>
            <td>
                <select>
                    <option th:each="price : ${show.prices}"
                            th:value="${price.id}"
                            th:text=" ${price.type} +': ' + ${price.amount} + ' €'"></option>
                </select>
            </td>
            <td>
                <button><a type="button" th:href="@{/reservation/{id}(id=${representation.id})}"> Réserver </a>
                </button>
            </td>
        </tr>
    </table>

    <div>
        <div th:each="entry : ${collaborators}">
            <h5 th:text="${entry.key}">Métiers</h5> <!-- Affiche le métier -->
            <ul>
                <li th:each="auteur : ${entry.value}" th:text="|${auteur.lastname} ${auteur.firstname}|"></li>
                <!-- Affiche le nom et prénom -->
            </ul>
        </div>
    </div>

</div>

</body>
</html>
