<!DOCTYPE html>
<html lang="fr" xmlns:layout="http://www.ultraq.net.mx/thymeleaf/layout" layout:decorate="~{layouts/main}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier le Profil</title>
</head>
<body>
<div class="container">
    <div id="notification" th:replace="~{main :: notification}"></div>
    <div layout:fragment="content">
        <h1 th:text="${role == 'ADMIN'} ? 'Modifier un profil utilisateur' : 'Modifier votre profil'"></h1>
        <!-- Affichage des erreurs -->
        <div th:if="${error}" style="color: red;">
            <p th:text="${error}"></p>
        </div>

        <!-- Formulaire de modification -->
        <form action="/modification" method="post" th:object="${user}">


            <!-- ID caché (utile pour identifier l'utilisateur à modifier) -->
            <input type="hidden" th:field="*{id}">

            <!-- Nom -->
            <label for="lastName">Nom :</label>
            <input type="text" id="lastName" name="lastName" th:value="*{lastName}" required>
            <br><br>

            <!-- Prénom -->
            <label for="firstName">Prénom :</label>
            <input type="text" id="firstName" name="firstName" th:value="*{firstName}" required>
            <br><br>

            <!-- Email -->
            <label for="email">Email :</label>
            <input type="email" id="email" name="email" th:value="*{email}" required>
            <br><br>

            <!-- Langue -->
            <label for="language">Langue :</label>
            <select id="language" name="language" th:field="*{language}">
                <option value="fr" th:selected="*{language == 'fr'}">Français</option>
                <option value="nl" th:selected="*{language == 'nl'}">Néerlandais</option>
            </select>
            <br><br>

<!--            &lt;!&ndash; Ancien mot de passe (uniquement visible si l'utilisateur n'est pas admin) &ndash;&gt;-->
<!--            <div th:if="${role == 'MEMBER'}">-->
<!--                <label for="oldPassword">Ancien mot de passe :</label>-->
<!--                <input type="password" id="oldPassword" name="oldPassword">-->
<!--                <br><br>-->
<!--            </div>-->

<!--            &lt;!&ndash; Nouveau mot de passe &ndash;&gt;-->
<!--            <label for="newPassword">Nouveau mot de passe :</label>-->
<!--            <input type="password" id="newPassword" name="newPassword">-->
<!--            <br><br>-->

<!--            &lt;!&ndash; Confirmation du nouveau mot de passe &ndash;&gt;-->
<!--            <label for="confirmPassword">Confirmer le nouveau mot de passe :</label>-->
<!--            <input type="password" id="confirmPassword" name="confirmPassword">-->
<!--            <br><br>-->

            <button type="submit">Enregistrer les modifications</button>
            <!-- CSRF Token (Spring Security) -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        </form>
    </div>
</div>
</body>
</html>
